name: Set up po4a
description: Install po4a 0.74 for the working-group YAML compatibility regression
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libyaml-tiny-perl liblocale-gettext-perl
    - shell: bash
      run: |
        # Pin an affected version: older po4a versions do not reproduce the pre-validation bug.
        mkdir -p "${RUNNER_TEMP}/working-groups-po4a"
        cd "${RUNNER_TEMP}/working-groups-po4a"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/mquinson/po4a/archive/refs/tags/v0.74.tar.gz --output po4a.tar.gz
        echo '6e390eb7707501a86f2e648d78fddb0d211d1e8699aa1ee201176e9f966a798b  po4a.tar.gz' | sha256sum --check
        tar -xzf po4a.tar.gz
        echo "PO4A_TRANSLATE=${PWD}/po4a-0.74/po4a-translate" >> "$GITHUB_ENV"
        echo "PERL5LIB=${PWD}/po4a-0.74/lib" >> "$GITHUB_ENV"
        perl -MYAML::Tiny -e 'print "YAML::Tiny $YAML::Tiny::VERSION\n"'
